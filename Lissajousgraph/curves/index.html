<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>リサジュー図形の3次元可視化</title>
<style>
:root {
  --bg: #070710;
  --panel: #090910;
  --border: #20202e;
  --fg: #e0e0e8;
  --mute: #ffffff44;
  --grid: #ffffff20;
  --curve: #00e5ff;
  --cx: #ff9800;
  --cy: #69f0ae;
  --now: #ff4081;
  color-scheme: dark;
}

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: monospace;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

#header {
  padding: 12px 16px 4px;
  text-align: center;
  color: var(--mute);
  font-size: 14px;
  letter-spacing: 4px;
  text-transform: uppercase;
}

#wrap {
  flex: 1;
  min-height: 0;
  position: relative;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: pointer;
}

#hint {
  position: absolute;
  left: 14px;
  top: 10px;
  font-size: 11px;
  color: var(--mute);
  pointer-events: none;
  letter-spacing: 1px;
}

#panel {
  background: var(--panel);
  border-top: 1px solid var(--border);
  padding: 12px 18px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 8px 24px;
  align-items: center;
  font-size: 12px;
}

label {
  display: grid;
  grid-template-columns: 4.5em 1fr 3.5em;
  gap: 8px;
  align-items: center;
  color: #999;
}

label output {
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: #ddd;
}

input[type=range] {
  width: 100%;
  accent-color: var(--curve);
  cursor: pointer;
}

.btns {
  display: flex;
  gap: 8px;
  grid-column: 1 / -1;
  max-width: 420px;
  margin-top: 4px;
}

label.chk {
  display: flex;
  gap: 6px;
  align-items: center;
  cursor: pointer;
  color: #aaa;
}

button {
  flex: 1;
  font-family: monospace;
  font-size: 12px;
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s ease;
}

#play {
  background: #152535;
  color: var(--curve);
}
#play.paused {
  background: #152515;
  color: var(--cy);
}

#reset {
  background: #251515;
  color: var(--now);
}
</style>
</head>
<body>

<div id="header">Lissajous 3D / Harmonograph</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hint">クリック: 再生/停止 ｜ ドラッグ: 視点回転</div>
</div>

<div id="panel">
  <label>振幅 Ax<input id="A" type="range" min="0.1" max="1" step="0.05" value="1"><output></output></label>
  <label>振幅 Ay<input id="B" type="range" min="0.1" max="1" step="0.05" value="1"><output></output></label>
  <label>振動数 a<input id="a" type="range" min="1" max="10" step="0.1" value="3"><output></output></label>
  <label>振動数 b<input id="b" type="range" min="1" max="10" step="0.1" value="2"><output></output></label>
  <label>位相差 δ<input id="d" type="range" min="0" max="360" step="1" value="90"><output></output></label>
  <label>速度 spd<input id="sp" type="range" min="0.1" max="3" step="0.1" value="1"><output></output></label>
  <label class="chk"><input id="persp" type="checkbox" checked> 遠近感 (Perspective)</label>
  <div class="btns">
    <button id="play">⏸ 一時停止</button>
    <button id="reset">↺ 最初から</button>
  </div>
</div>

<script>
"use strict";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const W = 4 * Math.PI, H = 2.2;
let yaw = 0.7, pit = 0.5, t = 0, playing = true, last = null, w = 0, h = 0;
let needsRedraw = true;

const P = { A: 1, B: 1, a: 3, b: 2, d: Math.PI / 2, sp: 1 };
const fmt = {
  A: v => (+v).toFixed(2),
  B: v => (+v).toFixed(2),
  a: v => (+v).toFixed(1),
  b: v => (+v).toFixed(1),
  d: v => v + "°",
  sp: v => (+v).toFixed(1)
};
const key = { A: "A", B: "B", a: "a", b: "b", d: "d", sp: "sp" };

// Elm準拠のネオンカラーパレット
const colors = {
  grid: "#ffffff18",
  curve: "#00e5ff",
  now: "#ff4081",
  mute: "#ffffff44",
  cx: "#ff9800",
  cy: "#69f0ae"
};

for (const id of Object.keys(key)) {
  const el = document.getElementById(id), out = el.parentNode.querySelector("output");
  const upd = () => {
    out.textContent = fmt[id](el.value);
    P[id] = id === "d" ? el.value * Math.PI / 180 : +el.value;
    needsRedraw = true;
  };
  el.addEventListener("input", upd);
  upd();
}

const playBtn = document.getElementById("play");
function togglePlay() {
  playing = !playing;
  playBtn.textContent = playing ? "⏸ 一時停止" : "▶ 再生";
  playBtn.className = playing ? "" : "paused";
  needsRedraw = true;
}
playBtn.onclick = togglePlay;

document.getElementById("reset").onclick = () => { t = 0; needsRedraw = true; };
const persp = document.getElementById("persp");
persp.addEventListener("change", () => { needsRedraw = true; });

function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  w = r.width; h = r.height;
  cv.width = w * dpr; cv.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  needsRedraw = true;
}
addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
resize();

// 視点ドラッグ ＆ クリック判定
let drag = null;
let moved = false;

cv.addEventListener("pointerdown", e => {
  drag = { x: e.clientX, y: e.clientY };
  moved = false;
  cv.setPointerCapture(e.pointerId);
  cv.style.cursor = "grabbing";
});

cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
    moved = true; // 一定距離以上動いたらドラッグとみなす
  }
  yaw += dx * 0.008;
  pit = Math.max(0, Math.min(Math.PI / 2, pit + dy * 0.008));
  drag = { x: e.clientX, y: e.clientY };
  needsRedraw = true;
});

const endDrag = () => {
  if (drag && !moved) {
    // 動かさずに離した場合はクリックとして判定（PLAY/STOP切り替え）
    togglePlay();
  }
  drag = null;
  cv.style.cursor = "pointer";
};
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", () => { drag = null; cv.style.cursor = "pointer"; });

function proj(x, y, z) {
  const zc = z - H / 2, cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pit), sp = Math.sin(pit);
  const x1 = x * cy - y * sy, y1 = x * sy + y * cy;
  const dep = y1 * cp - zc * sp, up = y1 * sp + zc * cp;
  const D = 7, k = persp.checked ? D / (D + dep) : 1, s = Math.min(w * 0.8, h * 0.9) / 3.2;
  return [w / 2 + s * x1 * k, h / 2 - s * up * k];
}

const X = tt => P.A * Math.sin(P.a * tt + P.d);
const Y = tt => P.B * Math.sin(P.b * tt);

function line(p, q) {
  ctx.beginPath();
  ctx.moveTo(p[0], p[1]);
  ctx.lineTo(q[0], q[1]);
  ctx.stroke();
}

function poly(pts) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath();
}

function drawTrajectory(col, pts, fn, lineWidth) {
  ctx.strokeStyle = col;
  ctx.lineWidth = lineWidth;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const p = fn(pts[i]);
    if (i === 0) ctx.moveTo(p[0], p[1]);
    else ctx.lineTo(p[0], p[1]);
  }
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, w, h);
  const { grid, curve, now, mute, cx: cxc, cy: cyc } = colors;
  const wy = 1, wx = 1;
  const c = [[-1, -1], [1, -1], [1, 1], [-1, 1]];

  // 1. x-t / y-t 平面（壁グリッド）
  ctx.lineWidth = 1;
  ctx.strokeStyle = grid;
  for (const [wall, wc] of [[[[-1, wy], [1, wy]], cxc], [[[wx, -1], [wx, 1]], cyc]]) {
    ctx.fillStyle = wc;
    poly([[...wall[0], 0], [...wall[1], 0], [...wall[1], H], [...wall[0], H]].map(p => proj(p[0], p[1], p[2])));
    ctx.globalAlpha = 0.05;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.stroke();
  }

  // 2. XY平面（現在時刻の底面）
  const bot = c.map(([x, y]) => proj(x, y, 0));
  poly(bot);
  ctx.globalAlpha = 0.08;
  ctx.fillStyle = "#ffffff";
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.stroke();

  // 軸線
  line(proj(-1, 0, 0), proj(1, 0, 0));
  line(proj(0, -1, 0), proj(0, 1, 0));

  // 3. 壁面用の波データ（高周波に合わせて動的サンプリング）
  const maxFreq = Math.max(P.a, P.b);
  const N_wall = Math.min(2400, Math.max(400, Math.round(W * maxFreq * 20)));
  const t0 = Math.max(0, t - W);
  const pts = [];
  for (let i = 0; i <= N_wall; i++) {
    const tt = t0 + (t - t0) * i / N_wall;
    pts.push({ x: X(tt), y: Y(tt), z: H * (t - tt) / W });
  }

  ctx.lineCap = "round";
  drawTrajectory(cxc, pts, p => proj(p.x, wy, p.z), 1.8);  // x(t) 波 (Orange)
  drawTrajectory(cyc, pts, p => proj(wx, p.y, p.z), 1.8);  // y(t) 波 (Green)

  // 4. XY平面（底面）のリサジュー図形（動的サンプリングで常に滑らかな曲線）
  const T_liss = 20 * Math.PI;
  const N_liss = Math.min(8000, Math.max(1500, Math.round(T_liss * maxFreq * 15)));
  ctx.strokeStyle = curve;
  ctx.lineWidth = 2.0;
  ctx.beginPath();
  for (let i = 0; i <= N_liss; i++) {
    const tt = (T_liss * i) / N_liss;
    const p = proj(X(tt), Y(tt), 0);
    if (i === 0) ctx.moveTo(p[0], p[1]);
    else ctx.lineTo(p[0], p[1]);
  }
  ctx.stroke();

  // 5. 現在点と投影点線
  const px = X(t), py = Y(t);
  const o = proj(px, py, 0), g = proj(px, wy, 0), v = proj(wx, py, 0);
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = cxc; line(g, o);
  ctx.strokeStyle = cyc; line(v, o);
  ctx.setLineDash([]);

  // 点の描画
  for (const [q, qc, r] of [[g, cxc, 4], [v, cyc, 4], [o, now, 5.5]]) {
    ctx.fillStyle = qc;
    ctx.beginPath();
    ctx.arc(q[0], q[1], r, 0, Math.PI * 2);
    ctx.fill();
  }

  // 6. ラベル
  ctx.font = "11px monospace";
  const lx = proj(-1, wy, H), ly = proj(wx, -1, H), a = proj(-1, -1, 0), m = proj(wx, wy, H);
  ctx.fillStyle = cxc; ctx.fillText("x(t) a=" + P.a.toFixed(1), lx[0], lx[1] - 8);
  ctx.fillStyle = cyc; ctx.fillText("y(t) b=" + P.b.toFixed(1), ly[0], ly[1] - 8);
  ctx.fillStyle = mute;
  ctx.fillText("XY-Plane [Lissajous]  t=" + t.toFixed(1), a[0], a[1] + 16);
  ctx.fillText("↑ Past (過去)", m[0] + 8, m[1]);
}

function frame(ts) {
  if (last === null) last = ts;
  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  if (playing) {
    t += dt * P.sp;
    needsRedraw = true;
  }
  if (needsRedraw) {
    draw();
    needsRedraw = false;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
