<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リサジュー図形の3次元可視化</title>

  <!-- ページの説明（meta description） -->
  <meta name="description" content="直交する2つの単振動からリサージュ曲線が生成される仕組みを視覚的に学べるインタラクティブシミュレーターです。周波数比、位相差、減衰係数、振幅をリアルタイムに変更して軌道を描画します。">
  
  <!-- 検索キーワード -->
  <meta name="keywords" content="リサージュ曲線, Lissajous, ハーモノグラフ, Harmonograph, 物理シミュレーション, 単振動, 数学アート, Elm">
  
  <!-- SNSシェア用 (OGP) -->
  <meta property="og:title" content="リサジュー図形の3次元可視化">
  <meta property="og:description" content="x・y軸の単振動とリサジュー図形の関係を視覚化するシミュレーター。">
  <meta property="og:type" content="website">


<style>
:root {
  --bg: #070710;
  --panel: #0a0a14;
  --border: #222234;
  --fg: #e0e0e8;
  --mute: #ffffff44;
  --grid: #ffffff1c;
  --curve: #00e5ff;
  --cx: #ff9800;
  --cy: #69f0ae;
  --now: #ff4081;
  color-scheme: dark;
}

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: monospace;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

#header {
  padding: 10px 16px 6px;
  text-align: center;
  color: #b8b8d0;
  font-size: 14px;
  letter-spacing: 4px;
  text-transform: uppercase;
  flex-shrink: 0;
}

/* メイン領域：PCでは左右配置 */
#main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: row;
  overflow: hidden;
}

/* 図形エリア（左側） */
#wrap {
  flex: 1;
  min-width: 0;
  min-height: 0;
  position: relative;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: pointer;
}

#hint {
  position: absolute;
  left: 14px;
  top: 10px;
  font-size: 11px;
  color: #9aa0bc;
  pointer-events: none;
  letter-spacing: 1px;
}

/* コントローラーパネル（右側） */
#panel {
  width: 330px;
  flex-shrink: 0;
  background: var(--panel);
  border-left: 1px solid var(--border);
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-size: 12px;
  overflow-y: auto;
  box-sizing: border-box;
}

#panel::-webkit-scrollbar {
  width: 6px;
}
#panel::-webkit-scrollbar-thumb {
  background: #252538;
  border-radius: 3px;
}

.ctrl-group {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.ctrl-title {
  color: #aaa;
  font-size: 11px;
}

.slider-box {
  display: flex;
  align-items: center;
  gap: 6px;
}

.ctrl-val {
  min-width: 3.4em;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: #00e5ff;
  font-weight: bold;
  font-size: 11px;
  flex-shrink: 0;
}

.step-btn {
  width: 26px;
  height: 24px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #151524;
  color: #ddd;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 14px;
  font-family: monospace;
  font-weight: bold;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  padding: 0;
}

.step-btn:active {
  background: #2a2a44;
  color: var(--curve);
  border-color: #404060;
}

input[type=range] {
  flex: 1;
  min-width: 0;
  accent-color: var(--curve);
  cursor: pointer;
}

.chk-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 4px;
}

label.chk {
  display: flex;
  gap: 6px;
  align-items: center;
  cursor: pointer;
  color: #aaa;
}

.btns {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}

button.act-btn {
  flex: 1;
  font-family: monospace;
  font-size: 12px;
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s ease;
}

#play {
  background: #152535;
  color: var(--curve);
}
#play.paused {
  background: #152515;
  color: var(--cy);
}

#reset {
  background: #251515;
  color: var(--now);
}

@media (max-width: 768px) {
  #main {
    flex-direction: column;
  }
  #wrap {
    flex: 1;
    min-height: 220px;
  }
  #panel {
    width: 100%;
    max-height: 52vh;
    border-left: none;
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    gap: 8px;
  }
}
</style>
</head>
<body>

<div id="header">Lissajous 3D / Harmonograph</div>

<div id="main">
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="hint">クリック: 再生/停止 ｜ ドラッグ: 視点回転</div>
  </div>

  <div id="panel">
    <!-- 1. 振動数 a -->
    <div class="ctrl-group">
      <span class="ctrl-title">振動数 a</span>
      <div class="slider-box">
        <button class="step-btn" data-step="-1">−</button>
        <input id="a" type="range" min="1" max="10" step="0.1" value="1.0">
        <span class="ctrl-val" id="val_a"></span>
        <button class="step-btn" data-step="1">+</button>
      </div>
    </div>

    <!-- 2. 振動数 b -->
    <div class="ctrl-group">
      <span class="ctrl-title">振動数 b</span>
      <div class="slider-box">
        <button class="step-btn" data-step="-1">−</button>
        <input id="b" type="range" min="1" max="10" step="0.1" value="1.3">
        <span class="ctrl-val" id="val_b"></span>
        <button class="step-btn" data-step="1">+</button>
      </div>
    </div>

    <!-- 3. 位相差 δ (delta) -->
    <div class="ctrl-group">
      <span class="ctrl-title">位相差 δ</span>
      <div class="slider-box">
        <button class="step-btn" data-step="-1">−</button>
        <input id="d" type="range" min="0" max="360" step="1" value="90">
        <span class="ctrl-val" id="val_d"></span>
        <button class="step-btn" data-step="1">+</button>
      </div>
    </div>

    <!-- 4. 振幅 Ax -->
    <div class="ctrl-group">
      <span class="ctrl-title">振幅 Ax</span>
      <div class="slider-box">
        <button class="step-btn" data-step="-1">−</button>
        <input id="A" type="range" min="0.1" max="1" step="0.05" value="0.70">
        <span class="ctrl-val" id="val_A"></span>
        <button class="step-btn" data-step="1">+</button>
      </div>
    </div>

    <!-- 5. 振幅 Ay -->
    <div class="ctrl-group">
      <span class="ctrl-title">振幅 Ay</span>
      <div class="slider-box">
        <button class="step-btn" data-step="-1">−</button>
        <input id="B" type="range" min="0.1" max="1" step="0.05" value="0.70">
        <span class="ctrl-val" id="val_B"></span>
        <button class="step-btn" data-step="1">+</button>
      </div>
    </div>

    <!-- 6. 速度 spd -->
    <div class="ctrl-group">
      <span class="ctrl-title">速度 spd</span>
      <div class="slider-box">
        <button class="step-btn" data-step="-1">−</button>
        <input id="sp" type="range" min="0.1" max="5.0" step="0.1" value="3.0">
        <span class="ctrl-val" id="val_sp"></span>
        <button class="step-btn" data-step="1">+</button>
      </div>
    </div>

    <!-- 7. ズーム zoom -->
    <div class="ctrl-group">
      <span class="ctrl-title">ズーム (Zoom)</span>
      <div class="slider-box">
        <button class="step-btn" data-step="-1">−</button>
        <input id="zm" type="range" min="0.5" max="2.0" step="0.05" value="1.00">
        <span class="ctrl-val" id="val_zm"></span>
        <button class="step-btn" data-step="1">+</button>
      </div>
    </div>

    <!-- チェック項目群（半透明をデフォルトでON） -->
    <div class="chk-group">
      <label class="chk"><input id="persp" type="checkbox" checked> 遠近感 (Perspective)</label>
      <label class="chk"><input id="transPlane" type="checkbox" checked> 平面半透明 (Translucent)</label>
    </div>

    <div class="btns">
      <button id="play" class="act-btn">⏸ 一時停止</button>
      <button id="reset" class="act-btn">↺ 最初から</button>
    </div>
  </div>
</div>

<script>
"use strict";
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const W = 4 * Math.PI, H = 2.0;
let yaw = 0.7, pit = 0.45, t = 0, playing = true, last = null, w = 0, h = 0;
let needsRedraw = true;
let lissScreenDirty = true;

const P = { a: 1.0, b: 1.3, d: Math.PI / 2, A: 0.70, B: 0.70, sp: 3.0, zm: 1.00 };
const fmt = {
  a: v => (+v).toFixed(1),
  b: v => (+v).toFixed(1),
  d: v => v + "°",
  A: v => (+v).toFixed(2),
  B: v => (+v).toFixed(2),
  sp: v => (+v).toFixed(1),
  zm: v => (+v).toFixed(2) + "x"
};
const keyList = ["a", "b", "d", "A", "B", "sp", "zm"];

const colors = {
  grid: "#ffffff18",
  curve: "#00e5ff",
  now: "#ff4081",
  mute: "#ffffff44",
  cx: "#ff9800",
  cy: "#69f0ae"
};

const X = tt => P.A * Math.sin(P.a * tt + P.d);
const Y = tt => P.B * Math.sin(P.b * tt);

// リサジュー図形の事前計算
let lissPoints = [];
const T_LISS_MAX = 24 * Math.PI;
function calcLissajous() {
  lissPoints = [];
  const maxFreq = Math.max(P.a, P.b);
  const N_liss = Math.min(6000, Math.max(800, Math.round(T_LISS_MAX * maxFreq * 18)));
  for (let i = 0; i <= N_liss; i++) {
    const tt = (T_LISS_MAX * i) / N_liss;
    lissPoints.push({ t: tt, x: X(tt), y: Y(tt), sx: 0, sy: 0 });
  }
  lissScreenDirty = true;
}

// コントロール設定
for (const id of keyList) {
  const el = document.getElementById(id);
  const out = document.getElementById("val_" + id);
  const row = el.closest(".ctrl-group");

  const upd = () => {
    out.textContent = fmt[id](el.value);
    if (id === "d") P.d = el.value * Math.PI / 180;
    else if (id === "zm") {
      P.zm = +el.value;
      lissScreenDirty = true;
    } else {
      P[id] = +el.value;
    }
    if (id !== "sp" && id !== "zm") {
      calcLissajous();
    }
    needsRedraw = true;
  };
  el.addEventListener("input", upd);

  row.querySelectorAll(".step-btn").forEach(btn => {
    const dir = parseInt(btn.dataset.step, 10);
    let timer = null, interval = null;

    const doStep = () => {
      const step = parseFloat(el.step) || 1;
      const min = parseFloat(el.min), max = parseFloat(el.max);
      let val = parseFloat(el.value) + dir * step;
      val = Math.max(min, Math.min(max, val));
      const decimals = (el.step.split(".")[1] || "").length;
      el.value = val.toFixed(decimals);
      upd();
    };

    const start = (e) => {
      e.preventDefault();
      doStep();
      timer = setTimeout(() => {
        interval = setInterval(doStep, 60);
      }, 300);
    };

    const stop = () => {
      if (timer) clearTimeout(timer);
      if (interval) clearInterval(interval);
      timer = null;
      interval = null;
    };

    btn.addEventListener("pointerdown", start);
    btn.addEventListener("pointerup", stop);
    btn.addEventListener("pointercancel", stop);
    btn.addEventListener("pointerleave", stop);
    btn.addEventListener("contextmenu", e => e.preventDefault());
  });

  upd();
}

const playBtn = document.getElementById("play");
function togglePlay() {
  playing = !playing;
  playBtn.textContent = playing ? "⏸ 一時停止" : "▶ 再生";
  playBtn.className = "act-btn " + (playing ? "" : "paused");
  needsRedraw = true;
}
playBtn.onclick = togglePlay;

const persp = document.getElementById("persp");
const transPlane = document.getElementById("transPlane");

persp.addEventListener("change", () => { lissScreenDirty = true; needsRedraw = true; });
transPlane.addEventListener("change", () => { needsRedraw = true; });

document.getElementById("reset").onclick = () => {
  t = 0;
  needsRedraw = true;
};

function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  w = r.width; h = r.height;
  cv.width = w * dpr; cv.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  lissScreenDirty = true;
  needsRedraw = true;
}
addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
resize();

// 視点操作ドラッグ
let drag = null, moved = false;
cv.addEventListener("pointerdown", e => {
  drag = { x: e.clientX, y: e.clientY };
  moved = false;
  cv.setPointerCapture(e.pointerId);
  cv.style.cursor = "grabbing";
});

cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
  yaw += dx * 0.008;
  pit = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, pit + dy * 0.008));
  drag = { x: e.clientX, y: e.clientY };
  lissScreenDirty = true;
  needsRedraw = true;
});

const endDrag = () => {
  if (drag && !moved) togglePlay();
  drag = null;
  cv.style.cursor = "pointer";
};
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", () => { drag = null; cv.style.cursor = "pointer"; });

// カメラ計算 (Zoom反映)
let cy = 0, sy = 0, cp = 0, sp_val = 0, s_scale = 1, isPersp = true;
const D = 7;

function updateCameraConstants() {
  cy = Math.cos(yaw);
  sy = Math.sin(yaw);
  cp = Math.cos(pit);
  sp_val = Math.sin(pit);
  s_scale = (Math.min(w * 0.75, h * 0.8) / 3.4) * P.zm;
  isPersp = persp.checked;
}

function proj(x, y, z) {
  const x1 = x * cy - y * sy;
  const y1 = x * sy + y * cy;
  const dep = y1 * cp - z * sp_val;
  const up = y1 * sp_val + z * cp;
  const k = isPersp ? D / (D + dep) : 1;
  return [w / 2 + s_scale * x1 * k, h / 2 - s_scale * up * k];
}

function line(p, q) {
  ctx.beginPath();
  ctx.moveTo(p[0], p[1]);
  ctx.lineTo(q[0], q[1]);
  ctx.stroke();
}

function poly(pts) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath();
}

function drawWaveDirect(col, N, tStart, tLen, zStart, zLen, isXWave, wallCoord) {
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    const ratio = i / N;
    const tt = tStart + tLen * ratio;
    const z = zStart + zLen * ratio;
    const x = isXWave ? X(tt) : wallCoord;
    const y = isXWave ? wallCoord : Y(tt);
    const p = proj(x, y, z);
    if (i === 0) ctx.moveTo(p[0], p[1]);
    else ctx.lineTo(p[0], p[1]);
  }
  ctx.stroke();
}

function drawWall(zMin, zMax, wy, wx, cxc, cyc) {
  ctx.lineWidth = 1;
  for (const [wall, wc] of [[[[-1, wy], [1, wy]], cxc], [[[wx, -1], [wx, 1]], cyc]]) {
    ctx.strokeStyle = colors.grid;
    poly([[...wall[0], zMin], [...wall[1], zMin], [...wall[1], zMax], [...wall[0], zMax]].map(p => proj(p[0], p[1], p[2])));
    ctx.fillStyle = wc;
    ctx.globalAlpha = 0.04;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.stroke();
  }
}

function draw() {
  ctx.clearRect(0, 0, w, h);
  updateCameraConstants();

  const { curve, now, mute, cx: cxc, cy: cyc } = colors;
  const wy = 1, wx = 1;
  const c = [[-1, -1], [1, -1], [1, 1], [-1, 1]];

  const maxFreq = Math.max(P.a, P.b);
  const N_half = Math.min(800, Math.max(120, Math.round(W * maxFreq * 8)));

  ctx.lineCap = "round";

  // 1. 奥側 (t軸マイナス: z < 0)
  drawWall(-H, 0, wy, wx, cxc, cyc);
  drawWaveDirect(cxc, N_half, t, W, 0, -H, true, wy);
  drawWaveDirect(cyc, N_half, t, W, 0, -H, false, wx);

  // 2. XY平面（デフォルト半透明 / 切り替え可）
  const bot = c.map(([x, y]) => proj(x, y, 0));
  poly(bot);
  if (transPlane.checked) {
    ctx.fillStyle = "rgba(9, 9, 21, 0.45)"; // 半透明（向こう側が見える）
  } else {
    ctx.fillStyle = "#090915"; // 完全不透過（向こう側が見えない）
  }
  ctx.fill();
  ctx.strokeStyle = "#ffffff30";
  ctx.lineWidth = 1;
  ctx.stroke();

  // 軸線
  ctx.strokeStyle = "#ffffff20";
  line(proj(-1, 0, 0), proj(1, 0, 0));
  line(proj(0, -1, 0), proj(0, 1, 0));

  // 3. リサジュー図形
  if (lissScreenDirty) {
    for (let i = 0; i < lissPoints.length; i++) {
      const p = proj(lissPoints[i].x, lissPoints[i].y, 0);
      lissPoints[i].sx = p[0];
      lissPoints[i].sy = p[1];
    }
    lissScreenDirty = false;
  }

  // 3-1. 未通過部分
  ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let i = 0; i < lissPoints.length; i++) {
    const pt = lissPoints[i];
    if (i === 0) ctx.moveTo(pt.sx, pt.sy);
    else ctx.lineTo(pt.sx, pt.sy);
  }
  ctx.stroke();

  // 3-2. 通過済み部分（シアン色に変化）
  ctx.strokeStyle = curve;
  ctx.lineWidth = 2.0;
  ctx.beginPath();
  let drawn = false;
  for (let i = 0; i < lissPoints.length; i++) {
    const pt = lissPoints[i];
    if (pt.t > t) {
      const p = proj(X(t), Y(t), 0);
      ctx.lineTo(p[0], p[1]);
      drawn = true;
      break;
    }
    if (i === 0) ctx.moveTo(pt.sx, pt.sy);
    else ctx.lineTo(pt.sx, pt.sy);
    drawn = true;
  }
  if (drawn) ctx.stroke();

  // 4. 手前側 (t軸プラス: z > 0)
  drawWall(0, H, wy, wx, cxc, cyc);
  drawWaveDirect(cxc, N_half, t - W, W, H, -H, true, wy);
  drawWaveDirect(cyc, N_half, t - W, W, H, -H, false, wx);

  // 5. 現在点 & ガイド線
  const px = X(t), py = Y(t);
  const o = proj(px, py, 0), g = proj(px, wy, 0), v = proj(wx, py, 0);
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = cxc; line(g, o);
  ctx.strokeStyle = cyc; line(v, o);
  ctx.setLineDash([]);

  for (const [q, qc, r] of [[g, cxc, 4], [v, cyc, 4], [o, now, 5.5]]) {
    ctx.fillStyle = qc;
    ctx.beginPath();
    ctx.arc(q[0], q[1], r, 0, Math.PI * 2);
    ctx.fill();
  }

  // 6. ラベル
  ctx.font = "11px monospace";
  const lx = proj(-1, wy, H), ly = proj(wx, -1, H), a = proj(-1, -1, 0);
  const mTop = proj(wx, wy, H), mBot = proj(wx, wy, -H);
  ctx.fillStyle = cxc; ctx.fillText("x(t) a=" + P.a.toFixed(1), lx[0], lx[1] - 8);
  ctx.fillStyle = cyc; ctx.fillText("y(t) b=" + P.b.toFixed(1), ly[0], ly[1] - 8);
  ctx.fillStyle = "#aaaabb";
  ctx.fillText("XY-Plane [Lissajous]  t=" + t.toFixed(1), a[0], a[1] + 16);
  ctx.fillStyle = mute;
  ctx.fillText("↑ Past (+t)", mTop[0] + 8, mTop[1]);
  ctx.fillText("↓ Future (-t)", mBot[0] + 8, mBot[1] + 10);
}

function frame(ts) {
  if (last === null) last = ts;
  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  if (playing) {
    t += dt * P.sp;
    needsRedraw = true;
  }
  if (needsRedraw) {
    draw();
    needsRedraw = false;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
